# EriseChat Docker Compose 部署（一键部署入口，说明见 docs/deploy.md §3）
#
# 架构约束（AGENTS.md §2.4）：业务仍是单容器（ASP.NET Core + SQLite + 本地文件卷），
# 仅额外允许一个 coturn 媒体中继容器（TURN 例外），二者都不是微服务拆分；
# HTTPS 入口走宿主侧 Tailscale Serve（内测）或 Caddy（公网）。
#
# 服务器上执行 `sudo bash infra/docker/deploy.sh` 会自动准备目录/.env/TURN 配置并调用本文件；
# 手动执行示例：
#   ERISECHAT_DATA_DIR=/opt/erisechat/data ERISECHAT_ENV_FILE=/opt/erisechat/.env \
#     docker compose up -d --build
name: erisechat

services:
  erisechat:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        DOTNET_REGISTRY: ${DOTNET_REGISTRY:-mcr.microsoft.com}
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        # 容器内非 root 用户 UID/GID，与 deploy.sh 对数据目录的 chown 使用同一值
        APP_UID: ${ERISECHAT_UID:-1000}
        APP_GID: ${ERISECHAT_UID:-1000}
    image: erisechat-server:${APP_VERSION:-1.2.0}
    container_name: erisechat-server
    restart: unless-stopped
    ports:
      # 只绑定回环：公网入口由 Tailscale Serve / Caddy 反代本机 6580
      - "127.0.0.1:${ERISECHAT_PORT:-6580}:6580"
    env_file:
      - ${ERISECHAT_ENV_FILE:-.env}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:6580
      # 显式覆盖 appsettings 的 Kestrel 回环绑定，容器内必须监听 0.0.0.0
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:6580
      App__DataDirectory: /data
      App__FileDirectory: /data/files
      App__DownloadDirectory: /data/downloads
      TZ: Asia/Shanghai
    volumes:
      - ${ERISECHAT_DATA_DIR:-./data}:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6580/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # TURN 媒体中继（AGENTS.md §2.4 的唯一例外）：只服务 tailnet，
  # 用 host 网络绑定 tailscale 地址，不做公网端口映射（V0.4 裁决）。
  coturn:
    image: ${TURN_IMAGE:-coturn/coturn:4.6.3}
    container_name: erisechat-turn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${ERISECHAT_TURN_CONFIG:-./coturn/turnserver.conf}:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
