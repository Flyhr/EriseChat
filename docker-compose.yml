# EiseChat 单容器 Docker Compose 部署（一键部署入口，说明见 docs/deploy.md §3）
#
# 架构约束（AGENTS.md §2.4）：服务端仍是单进程（ASP.NET Core + SQLite + 本地文件卷），
# 不使用多容器编排；HTTPS 入口走宿主侧 Tailscale Serve（内测）或 Caddy（公网）。
#
# 服务器上执行 `sudo bash infra/docker/deploy.sh` 会自动准备目录/.env 并调用本文件；
# 手动执行示例：
#   EISECHAT_DATA_DIR=/opt/eisechat/data EISECHAT_ENV_FILE=/opt/eisechat/.env \
#     docker compose up -d --build
name: eisechat

services:
  eisechat:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        DOTNET_REGISTRY: ${DOTNET_REGISTRY:-mcr.microsoft.com}
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
    image: eisechat-server:${APP_VERSION:-1.1.0}
    container_name: eisechat-server
    restart: unless-stopped
    ports:
      # 只绑定回环：公网入口由 Tailscale Serve / Caddy 反代本机 8080
      - "127.0.0.1:8080:8080"
    env_file:
      - ${EISECHAT_ENV_FILE:-.env}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      App__DataDirectory: /data
      App__FileDirectory: /data/files
      App__DownloadDirectory: /data/downloads
      TZ: Asia/Shanghai
    volumes:
      - ${EISECHAT_DATA_DIR:-./data}:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
