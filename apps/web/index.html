<!doctype html>
<html lang="zh-CN" data-ec-theme="azure">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var raw = localStorage.getItem('erisechat.settings')
        var saved = raw ? JSON.parse(raw) : null
        if (saved && (saved.theme === 'dark' || saved.theme === 'azure')) {
          document.documentElement.setAttribute('data-ec-theme', saved.theme)
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="EriseChat 自建即时通讯客户端" />
    <title>EriseChat</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
