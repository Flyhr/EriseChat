# EriseChat Windows 安装包配置（electron-builder；M4 实际打包，M0 先固化配置）。
# 约束（AGENTS.md §3 / internal-plan §5.2、§6.1）：NSIS 每用户安装、免签名、产物名 EriseChat-Setup-x.y.z.exe。

appId: com.erisechat.desktop
productName: EriseChat
copyright: Copyright © 2026 EriseChat

directories:
  output: dist
  buildResources: build

# 更新源（P2）：只用于生成 latest.yml、blockmap 与包内 app-update.yml。
# 运行时主进程按当前服务器配置 setFeedURL，这里必须是不可解析的占位地址，不得参与实际请求。
publish:
  provider: generic
  url: https://updates.invalid/erisechat

files:
  - dist-electron/**
  - package.json

# 打包态加载 web 壳产物：apps/web/dist/file（base './'）→ resources/web-dist（与 electron/main.ts 一致）。
# 不能用 dist/web：前者是给服务端同域托管用的绝对路径资源，file:// 下会白屏。
# 托盘图标单独带入 resources/icon.ico（build/icon.ico 只用于 exe 图标，不会打进 asar/resources）。
extraResources:
  - from: ../web/dist/file
    to: web-dist
  - from: build/icon.ico
    to: icon.ico
  - from: build/tray-alert.png
    to: tray-alert.png

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: EriseChat-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EriseChat
